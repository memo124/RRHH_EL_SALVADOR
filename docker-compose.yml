services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rrhh

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rrhh

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rrhh_el_salvador
      POSTGRES_USER: rrhh
      POSTGRES_PASSWORD: rrhh_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrhh -d rrhh_el_salvador"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rrhh

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm install --legacy-peer-deps && npm run build"
    profiles:
      - build

networks:
  rrhh:
    driver: bridge

volumes:
  postgres_data:
